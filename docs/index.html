// ============================================================

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.nav-link').forEach(a => a.classList.remove('active'));

  if (tab === 'dashboard') renderDashboard();

  else if (tab === 'reports') renderReports();
  else if (tab === 'standards') renderStandards();
  else if (tab === 'batch') renderBatch();
}

// ============================================================

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast toast-' + (type||'success'); t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

    </div>`;

  document.getElementById('stdSelect').addEventListener('change', checkAssessmentReady);
  document.getElementById('empName').addEventListener('input', checkAssessmentReady);

let selectedPPTFile = null;
function handlePPTFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  selectedPPTFile = file;
  document.getElementById('pptFileInfo').innerHTML = `📄 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
  checkAssessmentReady();
}

function checkAssessmentReady() {
  const std = document.getElementById('stdSelect')?.value;
  const name = document.getElementById('empName')?.value;
  document.getElementById('btnAnalyze').disabled = !(std && name && selectedPPTFile);
}

// ============================================================

  resultEl.innerHTML = '<p style="color:#6b7280;">⏳ 解析中...</p>';

  // Simulate processing delay
  await new Promise(r => setTimeout(r, 1200));
  btn.textContent = '⏳ 正在对标分析...';
  await new Promise(r => setTimeout(r, 1500));

  resultEl.innerHTML = `<div style="font-family:monospace;font-size:12px;line-height:1.8;white-space:pre-wrap;">
